
[project]
name = "creative-director"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.51.0",
    "google-adk[a2a]==1.31.1",
    "a2a-sdk",
    "python-dotenv>=1.0.0",
    "google-cloud-storage>=2.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
only-include = [
    "agent.py",
    "__init__.py",
    "display_image_tool.py",
    "get_image_links_tool.py",
    "prompt.py",
    "retry.py",
]